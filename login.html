<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Restaurant - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #667eea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid #667eea;
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: #1e3a5f;
            margin-bottom: 10px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
        }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            background: #ffffff;
            color: #333;
            outline: none;
        }

        .login-input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: #4a90e2;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .login-button:hover {
            background: #357abd;
            box-shadow: 0 6px 16px rgba(74, 144, 226, 0.4);
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: -10px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-logo">
            <img src="assets/logo.jpg" alt="Restaurant Logo"
                onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'color: white; font-size: 24px;\'>ABC</div>';">
        </div>
        <h1 class="login-title">ABC Restaurant</h1>
        <p class="login-subtitle">Enter password to continue</p>
        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group" style="position: relative;">
                <input type="password" id="passwordInput" class="login-input" placeholder="Enter Password" autofocus
                    required style="padding-right: 45px;">
                <button type="button" onclick="togglePasswordVisibility('passwordInput', this)"
                    style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.9); border: none; cursor: pointer; padding: 4px; color: #6b7280; font-size: 16px; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 4px; z-index: 10; line-height: 1;"
                    title="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg></button>
            </div>
            <div class="error-message" id="errorMessage">Incorrect password. Please try again.</div>
            <button type="submit" class="login-button">Login</button>
        </form>
    </div>

    <script>
        // Storage utility
        const Storage = {
            get: (key) => {
                const data = localStorage.getItem(key);
                if (data === null) {
                    if (key === 'menuItemOrder') {
                        return {};
                    }
                    if (key === 'loginPassword' || key === 'adminPassword') {
                        return null;
                    }
                    return null;
                }
                // Handle passwords as plain strings
                if (key === 'loginPassword' || key === 'adminPassword') {
                    // Try to parse as JSON first (in case it was stored as JSON), otherwise return as-is
                    try {
                        const parsed = JSON.parse(data);
                        return typeof parsed === 'string' ? parsed : data;
                    } catch (e) {
                        return data;
                    }
                }
                return JSON.parse(data);
            },
            set: (key, value) => {
                // Handle passwords as plain strings
                if (key === 'loginPassword' || key === 'adminPassword') {
                    localStorage.setItem(key, value);
                } else {
                    localStorage.setItem(key, JSON.stringify(value));
                }
            }
        };

        function getLoginPassword() {
            return Storage.get('loginPassword') ?? '';
        }

        // Toggle password visibility
        window.togglePasswordVisibility = (inputId, button) => {
            const input = document.getElementById(inputId);
            if (!input) return;

            if (input.type === 'password') {
                input.type = 'text';
                button.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
                button.title = 'Hide password';
            } else {
                input.type = 'password';
                button.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
                button.title = 'Show password';
            }
        };

        function handleLogin(event) {
            event.preventDefault();
            const passwordInput = document.getElementById('passwordInput');
            const errorMessage = document.getElementById('errorMessage');
            const enteredPassword = passwordInput.value.trim();

            if (enteredPassword === getLoginPassword()) {
                // Store authentication in sessionStorage
                sessionStorage.setItem('authenticated', 'true');
                // Redirect to main application
                window.location.href = 'index.html';
            } else {
                errorMessage.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        }

        // Check if already authenticated OR if login password is disabled
        if (sessionStorage.getItem('authenticated') === 'true' || getLoginPassword() === '') {
            if (getLoginPassword() === '') {
                sessionStorage.setItem('authenticated', 'true');
            }
            window.location.href = 'index.html';
        }

        // Focus on password input when page loads
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('passwordInput').focus();
        });
    </script>
</body>

</html>
